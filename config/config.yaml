project:
  name: ieee-cis-fraud-detection
  random_seed: 42

data:
  raw_dir: input_data/ieee-fraud-detection
  train_transaction: train_transaction.csv
  train_identity: train_identity.csv
  target_column: isFraud
  id_column: TransactionID

validation:
  test_size: 0.20
  # Fraction of the selection partition carved out for hyperparameter tuning.
  tuning_size: 0.20

model:
  name: validation_weighted_ensemble
  models: [lightgbm, xgboost, catboost]
  # When true, hyperparameters are chosen per booster via tune_model_configs
  # (src/models/ensemble.py) on the tuning split above, instead of using the
  # fixed values below. Set false to use n_estimators/learning_rate/num_leaves
  # directly for every booster.
  tune_hyperparameters: true
  n_estimators: 500
  learning_rate: 0.04
  num_leaves: 63
  max_depth: -1
  subsample: 0.80
  colsample_bytree: 0.80
  random_state: 42
  n_jobs: -1
  early_stopping_rounds: 50

evaluation:
  # Number of equal-width probability bins used for the calibration curve
  # and Expected Calibration Error, computed on the untouched holdout set.
  calibration_bins: 10
  # Relative cost of missing a fraud case (false negative) vs. wrongly
  # blocking a legitimate transaction (false positive). The decision
  # threshold saved to the artifact minimizes cost_false_negative * FN +
  # cost_false_positive * FP on the untouched holdout, instead of a fixed
  # 0.5 cutoff. Tune these to reflect your actual business costs.
  cost_false_negative: 5.0
  cost_false_positive: 1.0
  # Step size when sweeping candidate thresholds between 0 and 1.
  threshold_resolution: 0.01

# Feature-engineering flags for TransactionFeatureEngineer (src/features/
# preprocessing.py). All default to true in the class itself if omitted here;
# the values below are the empirically best combination found via a dedicated
# ablation study on time-based validation AUC (see README), not just the
# "everything on" default. Flip any to test its effect in isolation.
features:
  # uid (client identity reconstructed from card/addr columns + a D1-derived
  # day offset) turned out to be the dominant cause of a ~2-point time-based
  # AUC regression: it's extremely high-cardinality, so within a smaller
  # chronological training split its group-stat aggregates are mostly noise
  # from single-occurrence groups rather than a stable generalizable signal.
  # Disabling it recovered the regression and then some (0.9026 -> 0.9238).
  enable_uid_reconstruction: false
  # Moot while enable_uid_reconstruction is false (no uid column exists to
  # compute a time gap for); left true for whenever uid reconstruction is
  # revisited with a leakage-safe, expanding-window implementation.
  enable_uid_time_features: true
  # Dropping raw card1/card2/addr1 and pruning correlated V-columns were both
  # motivated by adversarial validation (they help a model tell train and test
  # apart), but ablation showed both are mildly *negative* for time-based AUC
  # here - being train/test-distinguishable doesn't mean a column lacks real
  # predictive signal. Keeping them scored best (0.9238 -> 0.9248).
  enable_v_column_pruning: false
  drop_raw_id_columns: false
  # D-column detrending (Dn - TransactionDT/86400) is a confirmed, clean win -
  # disabling it alone dropped AUC to 0.8996, well below even the regressed
  # baseline. Genuine time drift, correctly fixed.
  enable_d_column_detrending: true
