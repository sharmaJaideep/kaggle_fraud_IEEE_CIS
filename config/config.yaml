project:
  name: ieee-cis-fraud-detection
  random_seed: 42

data:
  raw_dir: input_data/ieee-fraud-detection
  train_transaction: train_transaction.csv
  train_identity: train_identity.csv
  target_column: isFraud
  id_column: TransactionID

validation:
  test_size: 0.20
  # Fraction of the selection partition carved out for hyperparameter tuning.
  tuning_size: 0.20

model:
  name: validation_weighted_ensemble
  models: [lightgbm, xgboost, catboost]
  # When true, hyperparameters are chosen per booster via tune_model_configs
  # (src/models/ensemble.py) on the tuning split above, instead of using the
  # fixed values below. Set false to use n_estimators/learning_rate/num_leaves
  # directly for every booster.
  tune_hyperparameters: true
  n_estimators: 500
  learning_rate: 0.04
  num_leaves: 63
  max_depth: -1
  subsample: 0.80
  colsample_bytree: 0.80
  random_state: 42
  n_jobs: -1
  early_stopping_rounds: 50

evaluation:
  # Number of equal-width probability bins used for the calibration curve
  # and Expected Calibration Error, computed on the untouched holdout set.
  calibration_bins: 10
  # Relative cost of missing a fraud case (false negative) vs. wrongly
  # blocking a legitimate transaction (false positive). The decision
  # threshold saved to the artifact minimizes cost_false_negative * FN +
  # cost_false_positive * FP on the untouched holdout, instead of a fixed
  # 0.5 cutoff. Tune these to reflect your actual business costs.
  cost_false_negative: 5.0
  cost_false_positive: 1.0
  # Step size when sweeping candidate thresholds between 0 and 1.
  threshold_resolution: 0.01
